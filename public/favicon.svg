<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Checkmark 3D Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <!-- Top-Left Floating Pixel Gradients -->
    <linearGradient id="blueSquareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleSquareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanSquareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Screen Inner Glow / Drop shadow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0088ff" flood-opacity="0.35" />
    </filter>
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00d2ff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Top-Left Floating Pixels -->
  <rect x="68" y="48" width="46" height="46" rx="12" fill="url(#blueSquareGrad)" />
  <rect x="128" y="86" width="50" height="50" rx="14" fill="url(#purpleSquareGrad)" />
  <rect x="52" y="112" width="42" height="42" rx="10" fill="url(#cyanSquareGrad)" />

  <!-- Monitor Frame & Stand -->
  <g id="monitor">
    <!-- Monitor Outer Body (Navy/Dark slate) -->
    <rect x="80" y="140" width="370" height="270" rx="42" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
    
    <!-- Monitor Screen Canvas (Clean White with subtle inset) -->
    <rect x="110" y="170" width="310" height="210" rx="24" fill="#ffffff" />

    <!-- 4 Diagnostic Subpixels inside Screen (Bottom-Left) -->
    <g transform="translate(136, 256)">
      <rect x="0" y="0" width="38" height="38" rx="8" fill="#ef4444" />
      <rect x="48" y="0" width="38" height="38" rx="8" fill="#10b981" />
      <rect x="0" y="48" width="38" height="38" rx="8" fill="#3b82f6" />
      <rect x="48" y="48" width="38" height="38" rx="8" fill="#f59e0b" />
    </g>

    <!-- Monitor Neck Stand -->
    <path d="M232 410 L216 472 L296 472 L280 410 Z" fill="#0f172a" />
    <!-- Monitor Base Stand -->
    <rect x="180" y="468" width="152" height="20" rx="10" fill="#0f172a" />
  </g>

  <!-- Big 3D Checkmark extending from screen -->
  <path
    d="M180 270 
       C180 270, 206 244, 230 272 
       L282 328 
       C288 334, 298 334, 304 328 
       L428 174 
       C446 152, 478 174, 462 196 
       L320 376 
       C304 396, 274 396, 258 376 
       L172 288 
       C164 280, 170 270, 180 270 Z"
    fill="url(#checkGrad)"
    filter="url(#checkGlow)"
  />
</svg>
